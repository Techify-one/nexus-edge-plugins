name: Publish marketplace

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      GH_TOKEN: ${{ github.token }}
      PLUGIN_SIGNING_PRIVATE_KEY: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY }}
      PLUGIN_SIGNING_KEY_ID: publisher-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build and verify signed artifacts
        run: |
          test -n "$PLUGIN_SIGNING_PRIVATE_KEY"
          pnpm package
          pnpm marketplace
          pnpm verify:packages
          mkdir -p sdk-release
          pnpm --filter @nexus/plugin-sdk pack --pack-destination "$GITHUB_WORKSPACE/sdk-release"
      - name: Publish immutable releases
        run: node scripts/publish-releases.mjs
      - name: Publish signed catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nexus-marketplace.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update signed plugin marketplace"
          git push origin HEAD:main
