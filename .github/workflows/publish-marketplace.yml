name: Publish marketplace

on:
  push:
    branches: [main]
    paths:
      - "*/manifest.json"
      - "marketplace.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip marketplace publish]')
    env:
      GH_TOKEN: ${{ github.token }}
      PLUGIN_SIGNING_PRIVATE_KEY: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY }}
      PLUGIN_SIGNING_KEY_ID: publisher-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build and verify signed artifacts
        run: |
          test -n "$PLUGIN_SIGNING_PRIVATE_KEY"
          for manifest in */manifest.json; do
            plugin_dir="${manifest%/manifest.json}"
            plugin_id="$(node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(value.id);' "$manifest")"
            plugin_version="$(node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(value.version);' "$manifest")"
            tag="${plugin_id}-v${plugin_version}"
            archive="${plugin_id}.plugin.zip"
            mkdir -p "${plugin_dir}/release"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release download "$tag" --pattern "$archive" --dir "${plugin_dir}/release" --clobber
            else
              pnpm --dir "$plugin_dir" package
            fi
          done
          pnpm marketplace
          pnpm verify:packages
          mkdir -p sdk-release
          sdk_version="$(node -e 'const value = require("./.marketplace/packages/plugin-sdk/package.json"); process.stdout.write(value.version);')"
          sdk_tag="plugin-sdk-v${sdk_version}"
          sdk_archive="nexus-plugin-sdk-${sdk_version}.tgz"
          if gh release view "$sdk_tag" >/dev/null 2>&1; then
            gh release download "$sdk_tag" --pattern "$sdk_archive" --dir sdk-release --clobber
          else
            pnpm --filter @nexus/plugin-sdk pack --pack-destination "$GITHUB_WORKSPACE/sdk-release"
          fi
      - name: Publish immutable releases
        run: node .marketplace/scripts/publish-releases.mjs
      - name: Publish signed catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nexus-marketplace.json
          git add -A -- '*/release/*.plugin.zip'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update signed plugin marketplace"
          git push origin HEAD:main
